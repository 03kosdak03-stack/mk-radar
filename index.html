<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>MK RADAR V11</title><script src='https://telegram.org/js/telegram-web-app.js'></script><style>
:root{color-scheme:dark;--bg:#080d13;--card:#111923;--line:#223043;--txt:#f5f7fa;--muted:#8fa1b5;--green:#23d18b;--blue:#579dff;--gold:#ffc857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.app{max-width:760px;margin:auto;padding:18px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:27px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:2px}.badge{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--green);font-size:12px}.search{width:100%;margin:18px 0 12px;padding:15px;border-radius:15px;border:1px solid var(--line);background:#101821;color:white;font-size:16px;outline:none}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0b1118;color:#c9d5e2;border-radius:999px;padding:10px 14px}.tab.active{background:#203149;color:white}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px}.mini b{display:block;font-size:18px}.mini span{color:var(--muted);font-size:11px}.list{display:grid;gap:10px}.card{background:linear-gradient(145deg,#111a24,#0d141c);border:1px solid var(--line);border-radius:17px;padding:14px;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.rank{color:var(--muted);width:28px}.sym{font-size:19px;font-weight:850;flex:1}.score{font-weight:800;color:var(--gold)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.metric{background:#0a1017;border-radius:10px;padding:8px}.metric small{display:block;color:var(--muted);font-size:10px}.metric b{font-size:14px}.up{color:var(--green)}.decision{margin-top:10px;font-size:12px;font-weight:800;color:#08120d;background:var(--green);display:inline-block;padding:5px 9px;border-radius:8px}.overlay{position:fixed;inset:0;background:rgba(3,7,11,.78);display:none;align-items:flex-end;z-index:5}.sheet{width:100%;max-height:86vh;overflow:auto;background:#0d141c;border-radius:24px 24px 0 0;padding:20px;border-top:1px solid #2b3d52}.close{float:right;border:0;background:#1c2937;color:white;border-radius:50%;width:34px;height:34px;font-size:18px}.detailTitle{font-size:28px;font-weight:900}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.detailBox{border:1px solid var(--line);border-radius:13px;padding:11px}.detailBox small{display:block;color:var(--muted)}.detailBox b{font-size:18px}.note{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.45}.empty{text-align:center;color:var(--muted);padding:40px 0}@media(max-width:420px){.metrics{grid-template-columns:repeat(3,1fr)}.brand{font-size:23px}}
</style></head><body><div class='app'><div class='top'><div><div class='brand'>📊 MK RADAR</div><div class='sub'>V11 • BIST Radar Prototipi</div></div><div class='badge'>V2 • Telegram</div></div><input id='q' class='search' placeholder='Hisse ara: DOHOL, AKSA...'><div class='tabs'><button class='tab active'>🔥 Radar</button><button class='tab'>🏆 İlk 20</button><button class='tab'>⭐ Takip</button><button class='tab'>🔔 Alarmlar</button></div><div class='summary'><div class='mini'><b id='cnt'>0</b><span>Radar hissesi</span></div><div class='mini'><b id='avg'>0%</b><span>Ort. potansiyel</span></div><div class='mini'><b id='best'>—</b><span>En yüksek skor</span></div></div><div id='list' class='list'></div></div><div id='overlay' class='overlay'><div class='sheet'><button class='close' onclick='closeDetail()'>×</button><div id='detail'></div></div></div><script>
const stocks=[
['DOHOL',21.42,43.672524,103.8867,81.166,8.8,.6,null,681.1,70,80,'ÇOK GÜÇLÜ'],
['AKSA',10.64,21.236731,99.5933,79.878,6.4,1.1,8.0,1007.36,60,82,'GÜÇLÜ'],
['ARDYZ',82.65,164.505183,99.0383,79.7115,19.9,3.9,7.7,422.7,82,82,'GÜÇLÜ'],
['TTKOM',50.8,100.539127,97.9117,79.3735,5.8,.7,2.5,0,78,88,'GÜÇLÜ'],
['FROTO',75.65,147.509935,94.99,78.497,8.0,1.5,7.4,0,84,88,'GÜÇLÜ'],
['EBEBK',79.6,155.17224,94.94,78.482,23.9,2.2,2.8,526.9,72,82,'GÜÇLÜ'],
['GLCVY',50.95,99.162287,94.6267,78.388,4.9,1.7,0,0,75,86,'GÜÇLÜ'],
['GWIND',21.98,42.559508,93.6283,78.0885,5.3,.7,7.5,0,82,82,'GÜÇLÜ'],
['MGROS',516,992.5776,92.36,77.708,13.6,1.0,3.2,0,80,90,'GÜÇLÜ'],
['TAVHL',266.25,510.840563,91.865,77.5595,16.8,1.2,5.7,0,86,90,'GÜÇLÜ'],
['CIMSA',43.44,82.76044,90.5167,77.155,9.5,1.1,7.0,0,82,84,'GÜÇLÜ']];
const fmt=n=>n==null?'—':Number(n).toLocaleString('tr-TR',{maximumFractionDigits:2});
function render(filter=''){const data=stocks.filter(s=>s[0].includes(filter.toUpperCase()));const el=document.getElementById('list');el.innerHTML=data.length?data.map((s,i)=>`<div class='card' onclick="detail('${s[0]}')"><div class='row'><div class='rank'>#${i+1}</div><div class='sym'>${s[0]}</div><div class='score'>⭐ ${fmt(s[4])}</div></div><div class='metrics'><div class='metric'><small>Fiyat</small><b>${fmt(s[1])} TL</b></div><div class='metric'><small>V11 Eder</small><b>${fmt(s[2])} TL</b></div><div class='metric'><small>Potansiyel</small><b class='up'>+${fmt(s[3])}%</b></div></div><span class='decision'>${s[11]}</span></div>`).join(''):`<div class='empty'>Hisse bulunamadı.</div>`;document.getElementById('cnt').textContent=data.length;document.getElementById('avg').textContent=data.length?('+'+fmt(data.reduce((a,s)=>a+s[3],0)/data.length)+'%'):'0%';document.getElementById('best').textContent=data[0]?.[0]||'—'}
function detail(sym){const s=stocks.find(x=>x[0]===sym);document.getElementById('detail').innerHTML=`<div class='detailTitle'>${s[0]}</div><div class='sub'>MK RADAR V11 detay görünümü</div><div class='detailGrid'>${[['Fiyat',fmt(s[1])+' TL'],['V11 Eder',fmt(s[2])+' TL'],['Potansiyel','+'+fmt(s[3])+'%'],['V11 Skor',fmt(s[4])],['F/K',fmt(s[5])],['PD/DD',fmt(s[6])],['FD/FAVÖK',fmt(s[7])],['Büyüme',fmt(s[8])+'%'],['Katalizör',fmt(s[9])],['Kalite',fmt(s[10])]].map(x=>`<div class='detailBox'><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class='decision'>${s[11]}</div><div class='note'>Prototip verileri MK RADAR V11 Excel örneklerinden alınmıştır. Bu sürüm canlı piyasa verisine bağlı değildir.</div>`;document.getElementById('overlay').style.display='flex'}function closeDetail(){document.getElementById('overlay').style.display='none'}document.getElementById('q').addEventListener('input',e=>render(e.target.value));if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}render();
</script></body></html>
