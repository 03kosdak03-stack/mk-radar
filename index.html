<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MK Radar</title><link rel="stylesheet" href="radar-style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="radar-app.js" defer></script></head><body><main>
<header><div><h1>📊 MK RADAR</h1><p>Bilanço · Değer · Potansiyel</p></div><span class="pill">Kayıtlı sonuçlar</span></header>
<div id="notice" role="status">Veriler yükleniyor…</div><label class="search">Hisse ara<input id="search" placeholder="DOHOL, AKSEN…" autocomplete="off"></label>
<nav><button data-tab="all" class="selected">🔥 Tüm hisseler</button><button data-tab="top">🏆 İlk 15</button><button data-tab="five">💼 Beşli</button><button data-tab="watch">⭐ Takip</button></nav>
<section id="stats" class="stats"></section><p id="stamp" class="muted"></p><section id="cards"></section><button id="more" hidden>Daha fazla göster</button>
<footer>Varsayımlı değer senaryoları · Yatırım doğrulaması tamamlanmadı.</footer>
<dialog id="detail"><button id="close" aria-label="Detayı kapat">✕</button><div id="detailBody"></div></dialog>
</main></body></html>
